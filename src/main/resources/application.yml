spring:
  application:
    name: realtime-leaderboard
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leaderboard}
    username: ${DB_USER:leaderboard}
    password: ${DB_PASSWORD:leaderboard}
    hikari:
      maximum-pool-size: 30      # default is 10; main write bottleneck under load
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # fine for a demo; use Flyway/Liquibase in production
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  tomcat:
    accept-count: 1000
    max-connections: 12000       # default 8192 is below 10,000

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # Must be at least 32 characters. Override with JWT_SECRET outside local development.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
    ttl-minutes: ${JWT_TTL_MINUTES:120}
  leaderboard:
    max-limit: 100
    default-limit: 10
    rebuild-on-startup: ${REBUILD_ON_STARTUP:true}
  stream:
    flush-ms: 500